SPECIFICATION SafetySpec

CONSTANTS
    Sessions = {s1}
    MaxRounds = 1
    MaxHandles = 2
    FaultBudget = 1
    EnableServiceLifecycle = TRUE
    Mutation = "none"

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    RequestHasContext
    ResponseMatchesSession
    ClosedOnlyAfterStop
    StoppedServiceHasNoWorkers
    FrozenPendingContext
    ReviewedSubmittedRound
PROPERTIES
    PublicationBeforeUnlock
    FeedbackPreservedUntilAcknowledged
    NoAcceptanceAfterClose
    ClosedStaysClosed
    HandleChangesOnlyWhenUnavailable
    SessionIsolation
    IdleWorkersStayDormant
